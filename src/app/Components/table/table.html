<div class="generic-table-wrapper mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" class="generic-mat-table">

    <!-- Columnas dinámicas generadas automáticamente a partir de las claves del JSON -->
    @for (col of displayedColumns; track col) {
      <ng-container [matColumnDef]="col">
        <th mat-header-cell *matHeaderCellDef class="table-header">
          {{ formatHeader(col) }}
        </th>
        <td mat-cell *matCellDef="let element" class="table-cell">
          @if (col === 'estado') {
            <span class="badge" [ngClass]="element[col]">
              {{ element[col] }}
            </span>
          } @else {
            {{ element[col] }}
          }
        </td>
      </ng-container>
    }

    <!-- Filas de encabezado y datos -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Fila vacía cuando no hay registros -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length || 1">
        No hay datos para mostrar.
      </td>
    </tr>

  </table>
</div>
