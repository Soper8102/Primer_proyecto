<div class="generic-table-wrapper mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" class="generic-mat-table">

    <!-- Columnas dinámicas generadas según los datos o la configuración -->
    @for (col of effectiveColumns; track col.key) {
      <ng-container [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef class="table-header">
          {{ col.header }}
        </th>
        <td mat-cell *matCellDef="let element" class="table-cell">
          <!-- Renderizado especial para columnas de estado/badge -->
          @if (col.key === 'estado') {
            <span class="badge" [ngClass]="element[col.key]">
              {{ element[col.key] }}
            </span>
          } @else if (col.key === 'precio') {
            <!-- Formato de moneda para precios -->
            ${{ element[col.key] }}
          } @else {
            {{ element[col.key] }}
          }
        </td>
      </ng-container>
    }

    <!-- Filas de encabezado y datos -->
    <tr mat-header-row *matHeaderRowDef="displayedColumnKeys"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumnKeys;"></tr>

    <!-- Fila vacía cuando no hay registros -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumnKeys.length">
        No hay datos para mostrar.
      </td>
    </tr>

  </table>
</div>
