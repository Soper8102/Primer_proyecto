@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'" [opened]="isHandset === false">
    
    <!-- Encabezado de la barra lateral -->
    <div class="sidenav-brand">
      <div class="brand-avatar">
        <mat-icon>dashboard</mat-icon>
      </div>
      <div class="brand-info">
        <span class="brand-title">Panel de Control</span>
        <span class="brand-subtitle">Gestión PC</span>
      </div>
    </div>

    <!-- Lista de Navegación con Íconos -->
    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/clientes" routerLinkActive="active-nav-item" (click)="isHandset && drawer.close()">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Clientes</span>
      </a>
      <a mat-list-item routerLink="/inventarios" routerLinkActive="active-nav-item" (click)="isHandset && drawer.close()">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Inventarios</span>
      </a>
      <a mat-list-item routerLink="/perro" routerLinkActive="active-nav-item" (click)="isHandset && drawer.close()">
        <mat-icon matListItemIcon>pets</mat-icon>
        <span matListItemTitle>Perros</span>
      </a>
      <a mat-list-item routerLink="/compras" routerLinkActive="active-nav-item" (click)="isHandset && drawer.close()">
        <mat-icon matListItemIcon>shopping_cart</mat-icon>
        <span matListItemTitle>Compras</span>
      </a>
      <a mat-list-item routerLink="/usuarios" routerLinkActive="active-nav-item" (click)="isHandset && drawer.close()">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        <span matListItemTitle>Usuarios</span>
      </a>

      <div class="nav-divider"></div>

      <a mat-list-item routerLink="/login" routerLinkActive="active-nav-item" class="auth-nav-link" (click)="isHandset && drawer.close()">
        <mat-icon matListItemIcon>lock_open</mat-icon>
        <span matListItemTitle>Iniciar Sesión</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content-layout">
    <!-- Barra Superior / Top Navbar -->
    <mat-toolbar class="top-navbar">
      @if (isHandset) {
      <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()" class="toggle-btn">
        <mat-icon>menu</mat-icon>
      </button>
      }
      <span class="navbar-title">Sistema de Gestión</span>
    </mat-toolbar>

    <!-- Contenido Principal -->
    <div class="page-container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
